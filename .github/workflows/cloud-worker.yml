name: Cloud collection and analysis
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0,10 * * *'
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: read
concurrency:
  group: bili-cloud-worker
  cancel-in-progress: false
jobs:
  worker:
    # Secrets are used only on the repository's own default branch.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.event_name == 'workflow_dispatch' || vars.CLOUD_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.CREDENTIAL_ENCRYPTION_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      CLOUD_MODE: 'true'
      CLOUD_WORKER: 'true'
      CLOUD_TEST_MODE: ${{ vars.CLOUD_TEST_MODE || 'true' }}
      CLOUD_SCHEDULE_ENABLED: ${{ vars.CLOUD_SCHEDULE_ENABLED || 'false' }}
      FINANCE_AUTO_ANALYSIS: ${{ vars.FINANCE_AUTO_ANALYSIS || 'false' }}
      LLM_BASE_URL: https://api.deepseek.com/v1
      LLM_MODEL: deepseek-flash
      LLM_THINKING: disabled
      USE_PURE_API: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            server/requirements.txt
            server/requirements-cloud.txt
      - name: Skip until database is configured
        if: env.DATABASE_URL == ''
        run: echo 'Database is not configured. No collection or AI calls.'
      - name: Install backend dependencies
        if: env.DATABASE_URL != ''
        run: pip install -r server/requirements-cloud.txt
      - name: Execute queued jobs
        if: env.DATABASE_URL != ''
        run: python tools/cloud_worker.py
      - name: Check public site during manual validation
        if: github.event_name == 'workflow_dispatch' && env.DATABASE_URL != ''
        run: python tools/check_cloud_site.py
      - name: Execute scheduled collection
        if: env.DATABASE_URL != '' && github.event.schedule == '0 0,10 * * *'
        run: python tools/cloud_worker.py --scheduled
